<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Codex Pulse — Your latest project, back at the top</title>
  <desc id="desc">Sorting illustration: the order starts as A, B, C. After a turn finishes in B, the local script changes it to B, A, C. This is not a client screenshot.</desc>
  <defs>
    <path id="folder" d="M0 3h7l3 4h12v15H0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#315bd6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="24" fill="#f6f8fa"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="64" y="66" fill="#59636e" font-size="18" letter-spacing="1.5">CODEX DESKTOP / LOCAL UTILITY</text>
    <text x="60" y="148" fill="#1f2328" font-size="72" font-weight="650" letter-spacing="-3">Codex Pulse</text>
    <text x="64" y="212" fill="#1f2328" font-size="32" font-weight="600">Your latest project,</text>
    <text x="64" y="258" fill="#1f2328" font-size="32" font-weight="600">back at the top.</text>
    <path d="M64 328h18l9-12 10 24 10-12h26" fill="none" stroke="#315bd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="335" fill="#59636e" font-size="20">Turn complete · Local sort · Exit</text>
  </g>
  <g id="project-order" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="610" y="76" fill="#59636e" font-size="22">Before</text>
    <text x="915" y="76" fill="#1f2328" font-size="22" font-weight="600">After a turn in B</text>
    <g id="before">
      <rect x="610" y="100" width="210" height="226" rx="16" fill="#ffffff"/>
      <text x="634" y="136" fill="#59636e" font-size="20">Projects</text>
      <rect x="624" y="209" width="182" height="44" rx="8" fill="#e8efff"/>
      <g color="#59636e"><use href="#folder" x="636" y="165"/><use href="#folder" x="636" y="275"/></g>
      <use href="#folder" x="636" y="220" color="#315bd6"/>
      <g fill="#1f2328" font-size="28"><text x="677" y="187">A</text><text x="677" y="297">C</text></g>
      <text x="677" y="242" fill="#315bd6" font-size="28" font-weight="650">B</text>
    </g>
    <path id="move-to-top" d="M827 231C867 231 867 176 907 176" fill="none" stroke="#315bd6" stroke-width="3" marker-end="url(#arrow)"/>
    <g id="after">
      <rect x="915" y="100" width="210" height="226" rx="16" fill="#ffffff"/>
      <text x="939" y="136" fill="#59636e" font-size="20">Projects</text>
      <rect x="929" y="154" width="182" height="44" rx="8" fill="#ddf4e8"/>
      <g color="#59636e"><use href="#folder" x="941" y="220"/><use href="#folder" x="941" y="275"/></g>
      <use href="#folder" x="941" y="165" color="#1f2328"/>
      <g fill="#1f2328" font-size="28"><text x="982" y="187" font-weight="650">B</text><text x="982" y="242">A</text><text x="982" y="297">C</text></g>
    </g>
    <text x="610" y="366" fill="#59636e" font-size="18">Sidebar sorting illustration</text>
  </g>
</svg>
